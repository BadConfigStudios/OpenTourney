server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Backend API routes: proxy the real path prefixes to the backend Service
    # (Kubernetes Service "backend", see charts/opentourney/templates/service-backend.yaml,
    # listening on Values.backend.port, currently 8000). Authorization and other
    # headers are forwarded by proxy_pass by default; nothing here strips them.
    location /events {
        proxy_pass http://backend:8000;
    }

    # The SPA route /pods/:podId/pairings is not a backend endpoint (unlike
    # the sibling /pods/:podId/report route, which IS a real backend path and
    # is intentionally left alone here — see PR4). Without this, the plain
    # prefix match below would swallow it and the backend would 404 on hard
    # refresh / direct link. A regex location always takes priority over a
    # prefix location in nginx, regardless of declaration order.
    location ~ ^/pods/[^/]+/pairings$ {
        try_files $uri /index.html;
    }

    location /pods {
        proxy_pass http://backend:8000;
    }

    location /entries {
        proxy_pass http://backend:8000;
    }

    location /matches {
        proxy_pass http://backend:8000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
