namespace: opentourney-staging

imagePullSecrets:
  - name: ghcr-pull

backend:
  image:
    tag: latest
    pullPolicy: Always
  replicas: 1

frontend:
  image:
    tag: latest
    pullPolicy: Always
  replicas: 1
  oidc:
    authority: "https://opentourney-staging.badconfig.com"
    # clientId and projectId are set per-deploy via
    # --set-string frontend.oidc.clientId=<id> and
    # --set-string frontend.oidc.projectId=<id>, the same pattern
    # secrets.oidcAudience already uses (Phase 15) -- the opentourney-frontend
    # app (and the Zitadel project itself) don't exist until Zitadel's
    # bootstrap sidecar has run once, so neither can be a static values.yaml
    # default.

docs:
  image:
    tag: latest
    pullPolicy: Always
  replicas: 1

percona:
  enabled: true
  clusterName: opentourney-staging-pg
  pgVersion: "16"
  storageSize: 1Gi
  backupStorageSize: 1Gi

secrets:
  oidcIssuer: "https://opentourney-staging.badconfig.com"
  oidcJwksUrl: "http://zitadel:8080/oauth/v2/keys"

zitadel:
  enabled: true
  externalDomain: "opentourney-staging.badconfig.com"
  externalSecure: true
  externalPort: 443
  login:
    publicBaseUri: "https://opentourney-staging.badconfig.com/ui/v2/login"

ingress:
  enabled: true
  hostname: "opentourney-staging.badconfig.com"
