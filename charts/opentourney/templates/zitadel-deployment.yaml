{{- if and .Values.zitadel.enabled (not .Values.percona.enabled) }}
{{- fail "zitadel.enabled=true requires percona.enabled=true (Zitadel's Postgres user is declared on the PerconaPGCluster)" }}
{{- end }}
{{- if .Values.zitadel.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ot.fullname" . }}-zitadel
  labels:
    {{- include "ot.labels" . | nindent 4 }}
    app.kubernetes.io/component: zitadel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: zitadel
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: zitadel
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        # Ties the pod template to the bootstrap script's content so a bootstrap.py edit
        # + `helm upgrade` actually restarts the pod and picks up the fix. Safe now that the
        # PAT is persisted to a Secret (see the "bootstrap" container below) rather than only
        # living in the emptyDir — a pod replacement no longer loses the one-shot credential.
        checksum/bootstrap-configmap: {{ include (print $.Template.BasePath "/zitadel-bootstrap-configmap.yaml") . | sha256sum }}
        # Same reasoning, for the SystemAPIUsers config -- core only re-reads --config
        # files on process start, so a content change needs a pod restart to take effect.
        # Unconditional now: the bootstrap system user (SYSTEM_OWNER) must exist
        # regardless of zitadel.login.enabled.
        checksum/system-api-users-configmap: {{ include (print $.Template.BasePath "/zitadel-system-api-users-configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "ot.fullname" . }}-zitadel
      # Disabled: the Service is intentionally named "zitadel" (see zitadel-service.yaml), which
      # causes kubelet to inject a legacy Docker-links env var ZITADEL_PORT=tcp://<clusterIP>:8080
      # into this pod. That collides with Zitadel's own ZITADEL_PORT config field, which expects a
      # bare numeric port and fails to parse the URL. enableServiceLinks: false stops kubelet from
      # injecting any {SVCNAME}_* service-discovery env vars into this pod.
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: pat
          emptyDir: {}
        - name: bootstrap-script
          configMap:
            name: {{ include "ot.fullname" . }}-zitadel-bootstrap
        - name: bootstrap-system-key-cert
          secret:
            secretName: {{ printf "%s-zitadel-bootstrap-system-key" (include "ot.fullname" .) }}
            items:
              - key: tls.crt
                path: tls.crt
        - name: system-api-users-config
          configMap:
            name: {{ include "ot.fullname" . }}-zitadel-system-api-users
        {{- if .Values.zitadel.login.enabled }}
        - name: login-client-cert
          secret:
            secretName: {{ printf "%s-zitadel-login-service-key" (include "ot.fullname" .) }}
            items:
              - key: tls.crt
                path: tls.crt
        {{- end }}
        - name: bootstrap-system-key
          secret:
            secretName: {{ printf "%s-zitadel-bootstrap-system-key" (include "ot.fullname" .) }}
            items:
              - key: tls.key
                path: tls.key
      containers:
        - name: zitadel
          image: "{{ .Values.zitadel.image.repository }}:{{ .Values.zitadel.image.tag }}"
          imagePullPolicy: {{ .Values.zitadel.image.pullPolicy }}
          args:
            - start-from-init
            - --masterkeyFromEnv
            - --config
            - /config/system-api-users.yaml
          volumeMounts:
            - name: pat
              mountPath: /pat
            - name: bootstrap-system-key-cert
              mountPath: /bootstrap-system-key
              readOnly: true
            - name: system-api-users-config
              mountPath: /config
              readOnly: true
            {{- if .Values.zitadel.login.enabled }}
            - name: login-client-cert
              mountPath: /login-client-cert
              readOnly: true
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "ot.fullname" . }}-zitadel-secrets
          env:
            - name: ZITADEL_EXTERNALDOMAIN
              value: {{ .Values.zitadel.externalDomain | default (printf "zitadel.%s.svc.cluster.local" .Release.Namespace) | quote }}
            - name: ZITADEL_EXTERNALPORT
              value: {{ .Values.zitadel.externalPort | quote }}
            - name: ZITADEL_EXTERNALSECURE
              value: {{ .Values.zitadel.externalSecure | quote }}
            - name: ZITADEL_TLS_ENABLED
              value: "false"
            - name: ZITADEL_DATABASE_POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.percona.clusterName }}-pguser-zitadel
                  key: host
            - name: ZITADEL_DATABASE_POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.percona.clusterName }}-pguser-zitadel
                  key: port
            - name: ZITADEL_DATABASE_POSTGRES_DATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.percona.clusterName }}-pguser-zitadel
                  key: dbname
            - name: ZITADEL_DATABASE_POSTGRES_USER_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.percona.clusterName }}-pguser-zitadel
                  key: user
            - name: ZITADEL_DATABASE_POSTGRES_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.percona.clusterName }}-pguser-zitadel
                  key: password
            - name: ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE
              value: "require"
            - name: ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.percona.clusterName }}-pguser-zitadel
                  key: user
            - name: ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.percona.clusterName }}-pguser-zitadel
                  key: password
            - name: ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE
              value: "require"
            - name: ZITADEL_FIRSTINSTANCE_ORG_NAME
              value: {{ .Values.zitadel.firstInstance.orgName | quote }}
            - name: ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME
              value: {{ .Values.zitadel.firstInstance.adminUsername | quote }}
            - name: ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME
              value: "bootstrap-automation"
            - name: ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME
              value: "bootstrap-automation"
            # 1 year out, not the original ~4-year 2030 date: the PAT is now durably persisted
            # to a Secret on first acquisition (see the "bootstrap" container below) and reused
            # across pod restarts, so it functions as the ongoing bootstrap-sidecar credential
            # rather than a one-shot value — a long expiry still makes sense, but a bounded,
            # renewable-on-purpose window is safer than a near-decade-long token.
            - name: ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE
              value: "2027-08-16T00:00:00Z"
            - name: ZITADEL_FIRSTINSTANCE_PATPATH
              value: "/pat/pat.txt"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /debug/healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          # start-from-init runs DB migration + FirstInstance bootstrap (org/roles/
          # users/PAT write) + serving in one process on first boot, which can take
          # well over 30s against a cold Postgres schema. initialDelay + failureThreshold
          # * periodSeconds gives ~4 minutes of first-boot slack before a restart.
          livenessProbe:
            httpGet:
              path: /debug/healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 6
        - name: bootstrap
          image: python:3.12-alpine
          # `;` before `sleep infinity`, not `&&`: the container must park after bootstrap.py
          # exits on EITHER path (success, or a wait_for_pat() timeout when already bootstrapped)
          # rather than exiting itself. A Deployment can't set restartPolicy per-container, so an
          # exiting container restart-loops forever, which keeps the pod's Ready condition false
          # and pulls it out of svc/zitadel's endpoints even though the zitadel container is healthy.
          command: ["sh", "-c", "pip install --no-cache-dir requests==2.32.3 'PyJWT[crypto]'==2.10.1 && python /scripts/bootstrap.py; sleep infinity"]
          env:
            # Zitadel validates the request Host header against ZITADEL_EXTERNALDOMAIN
            # (anti-DNS-rebinding protection) and 404s otherwise. The sidecar connects
            # via localhost:8080 (same pod) but must still present the external domain
            # as the Host header for every Management API call.
            - name: ZITADEL_EXTERNAL_DOMAIN
              value: {{ .Values.zitadel.externalDomain | default (printf "zitadel.%s.svc.cluster.local" .Release.Namespace) | quote }}
            # Secret used to durably persist the FirstInstance-minted PAT beyond the emptyDir's
            # pod lifetime — see bootstrap.py's get_pat_from_secret()/save_pat_to_secret().
            - name: ZITADEL_PAT_SECRET_NAME
              value: {{ printf "%s-zitadel-pat" (include "ot.fullname" .) | quote }}
            # Zitadel's system-JWT audience check requires an exact string match against
            # core's own external URL. Port is only appended when it isn't the scheme's
            # default -- identical logic to zitadel-login-configmap.yaml's AUDIENCE, which
            # this must match exactly since both are validated by the same core check
            # (confirmed live during Task 8 of the parent plan: a missing port on a
            # non-default port caused every call to 401 with "audience is not valid").
            {{- $extDomain := .Values.zitadel.externalDomain | default (printf "zitadel.%s.svc.cluster.local" .Release.Namespace) }}
            # ot.zitadelOrigin (see _helpers.tpl) normalizes externalSecure to a real
            # bool before using it as a condition -- ternary() requires a strict bool;
            # --set-string zitadel.externalSecure=true (this chart's deploy convention,
            # see scripts/staging-upgrade.sh) makes it a string, which ternary rejects
            # ("wrong type for value; expected bool; got string" -- hit live).
            - name: ZITADEL_SYSTEM_API_AUDIENCE
              value: {{ include "ot.zitadelOrigin" (dict "secure" .Values.zitadel.externalSecure "port" .Values.zitadel.externalPort "domain" $extDomain) | quote }}
            {{- if .Values.zitadel.login.enabled }}
            - name: ZITADEL_LOGIN_V2_BASE_URI
              # publicBaseUri is an explicit opt-in override for environments that expose
              # Login V2 externally (e.g. a Cloudflare tunnel route) -- browser redirects
              # from core need a URI the browser can actually reach, unlike the in-cluster
              # default below. Empty by default: most deploys never need this.
              # Both branches include the /ui/v2/login suffix -- the only shape ever
              # confirmed working live (issue #88 #1); a bare host 404s.
              value: {{ .Values.zitadel.login.publicBaseUri | default (printf "http://%s-zitadel-login:3000/ui/v2/login" (include "ot.fullname" .)) | quote }}
            {{- end }}
            # opentourney-frontend's registered OIDC redirect URI (bootstrap.py). The
            # frontend and Zitadel deliberately share one public origin (see
            # gateway-ingress.yaml's single-hostname routing) -- reusing
            # zitadel.externalSecure/externalPort for scheme/port is safe because the
            # fail guard in gateway-ingress.yaml (issue #88 minor #8) requires
            # ingress.hostname to equal zitadel.externalDomain whenever both are set.
            # Only meaningful for a real browser login when a public ingress exists --
            # without one there's no way to complete a real OIDC redirect anyway (this
            # deploy mode is curl/port-forward-only already). Falls back to an
            # in-cluster, non-functional-for-browser-login placeholder instead of
            # hard-failing the render when ingress.enabled=false, restoring the
            # pre-existing behavior of the hardcoded constant this env var replaced
            # (which also never depended on ingress.hostname) -- confirmed live: this
            # exact env var addition broke `zitadel.enabled=true, ingress.enabled=false`
            # renders that worked before this PR.
            {{- if .Values.ingress.enabled }}
            - name: ZITADEL_FRONTEND_APP_REDIRECT_URI
              value: {{ printf "%s/callback" (include "ot.zitadelOrigin" (dict "secure" .Values.zitadel.externalSecure "port" .Values.zitadel.externalPort "domain" (required "ingress.hostname is required when ingress.enabled=true (opentourney-frontend's OIDC redirect URI derives from it)" .Values.ingress.hostname))) | quote }}
            {{- else }}
            - name: ZITADEL_FRONTEND_APP_REDIRECT_URI
              # frontend's in-cluster Service is named plainly "frontend" (see
              # service-frontend.yaml), NOT "<release>-frontend" -- an earlier version
              # of this fallback used the ot.fullname-prefixed form, which resolves to
              # no Service at all (caught in code review, PR #90).
              value: "http://frontend/callback"
            {{- end }}
          volumeMounts:
            - name: pat
              mountPath: /pat
            - name: bootstrap-script
              mountPath: /scripts
            - name: bootstrap-system-key
              mountPath: /bootstrap-system-key
              readOnly: true
{{- end }}
