{{- if .Values.ingress.enabled }}
{{- if not .Values.ingress.hostname }}
{{- fail "ingress.hostname is required when ingress.enabled=true" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ot.fullname" . }}-gateway
  labels:
    {{- include "ot.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.hostname }}
      http:
        paths:
          {{- if .Values.zitadel.enabled }}
          # Core Zitadel's own endpoints -- OIDC discovery, JWKS, authorize/token,
          # userinfo/end_session (/oidc), external IdP callbacks (/idps), and the v2
          # gRPC-gateway API (/v2, e.g. features/instance). Without these, requests
          # fall through to the frontend's SPA catch-all and get a 200 with the SPA
          # shell instead of a real 404 from Zitadel (issue #88 #3) -- silently
          # breaking oidc-client-ts's userinfo/end_session calls (Phase 16 PR2).
          - path: /oauth
            pathType: Prefix
            backend:
              service:
                name: zitadel
                port:
                  number: 8080
          - path: /.well-known
            pathType: Prefix
            backend:
              service:
                name: zitadel
                port:
                  number: 8080
          - path: /oidc
            pathType: Prefix
            backend:
              service:
                name: zitadel
                port:
                  number: 8080
          - path: /idps
            pathType: Prefix
            backend:
              service:
                name: zitadel
                port:
                  number: 8080
          - path: /v2
            pathType: Prefix
            backend:
              service:
                name: zitadel
                port:
                  number: 8080
          {{- end }}
          {{- if and .Values.zitadel.enabled .Values.zitadel.login.enabled }}
          - path: /ui/v2/login
            pathType: Prefix
            backend:
              service:
                name: {{ include "ot.fullname" . }}-zitadel-login
                port:
                  number: 3000
          {{- end }}
          # Everything else -- the frontend SPA, which already proxies its own
          # /events, /organizations, etc. paths to the backend internally.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
{{- end }}
