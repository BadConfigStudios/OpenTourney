apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ot.fullname" . }}-secrets
  labels:
    {{- include "ot.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "secrets.databaseUrl is required" .Values.secrets.databaseUrl | quote }}
  OIDC_ISSUER: {{ .Values.secrets.oidcIssuer | quote }}
  OIDC_AUDIENCE: {{ .Values.secrets.oidcAudience | quote }}
  {{- if .Values.secrets.oidcJwksUrl }}
  OIDC_JWKS_URL: {{ .Values.secrets.oidcJwksUrl | quote }}
  {{- end }}
  {{- if .Values.secrets.oidcJwksStatic }}
  OIDC_JWKS_STATIC: {{ .Values.secrets.oidcJwksStatic | quote }}
  {{- end }}
  PERSONA_ORGANIZER_TOKEN: {{ .Values.secrets.personaOrganizerToken | quote }}
  PERSONA_SCOREKEEPER_TOKEN: {{ .Values.secrets.personaScorekeeperToken | quote }}
  PERSONA_PLAYER_TOKEN: {{ .Values.secrets.personaPlayerToken | quote }}
