apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ot.fullname" . }}-frontend
  labels:
    {{- include "ot.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: frontend
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: frontend
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          env:
            - name: PERSONA_ORGANIZER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "ot.fullname" . }}-secrets
                  key: PERSONA_ORGANIZER_TOKEN
            - name: PERSONA_SCOREKEEPER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "ot.fullname" . }}-secrets
                  key: PERSONA_SCOREKEEPER_TOKEN
            - name: PERSONA_PLAYER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "ot.fullname" . }}-secrets
                  key: PERSONA_PLAYER_TOKEN
          ports:
            - containerPort: {{ .Values.frontend.port }}
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.frontend.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
