{{- if and .Values.zitadel.enabled .Values.zitadel.ingress.enabled }}
{{- if not .Values.zitadel.ingress.hostname }}
{{- fail "zitadel.ingress.hostname is required when zitadel.ingress.enabled=true" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ot.fullname" . }}-zitadel
  labels:
    {{- include "ot.labels" . | nindent 4 }}
  annotations:
    # Forces core's anti-DNS-rebinding check to see the internal externalDomain
    # regardless of the public hostname a browser actually used to get here --
    # see zitadel-ingress-middleware.yaml for why this exists instead of a
    # migration of externalDomain itself.
    traefik.ingress.kubernetes.io/router.middlewares: {{ printf "%s-%s-zitadel-internal-host@kubernetescrd" .Release.Namespace (include "ot.fullname" .) }}
spec:
  ingressClassName: {{ .Values.zitadel.ingress.className }}
  rules:
    - host: {{ .Values.zitadel.ingress.hostname }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                # Bare "zitadel", not ot.fullname-prefixed -- matches
                # zitadel-service.yaml's actual Service name exactly (see
                # Task 4's live-verification fix for the same footgun).
                name: zitadel
                port:
                  number: 8080
{{- end }}
