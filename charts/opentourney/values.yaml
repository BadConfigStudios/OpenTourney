namespace: opentourney

imagePullSecrets: []

backend:
  image:
    repository: ghcr.io/badconfigstudios/opentourney/backend
    tag: latest
    pullPolicy: Always
  replicas: 1
  port: 8000

frontend:
  image:
    repository: ghcr.io/badconfigstudios/opentourney/frontend
    tag: latest
    pullPolicy: Always
  replicas: 1
  port: 80

docs:
  image:
    repository: ghcr.io/badconfigstudios/opentourney/docs
    tag: latest
    pullPolicy: Always
  replicas: 1
  port: 80

# Percona PostgreSQL Operator CRD
percona:
  enabled: true
  clusterName: opentourney-pg
  pgVersion: "16"
  storageSize: 5Gi
  backupStorageSize: 5Gi

secrets:
  databaseUrl: ""
  oidcIssuer: ""
  oidcAudience: ""
  oidcJwksUrl: ""
  oidcJwksStatic: ""

zitadel:
  enabled: false
  image:
    repository: ghcr.io/zitadel/zitadel
    tag: v4.17.1
    pullPolicy: IfNotPresent
  externalDomain: "zitadel.opentourney-staging.svc.cluster.local"
  externalPort: 8080
  firstInstance:
    orgName: "OpenTourney"
    adminUsername: "admin"
    adminPassword: ""
