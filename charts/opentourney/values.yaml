namespace: opentourney

imagePullSecrets: []

backend:
  image:
    repository: ghcr.io/badconfigstudios/opentourney/backend
    tag: latest
    pullPolicy: Always
  replicas: 1
  port: 8000

frontend:
  image:
    repository: ghcr.io/badconfigstudios/opentourney/frontend
    tag: latest
    pullPolicy: Always
  replicas: 1
  port: 80
  # Non-secret OIDC client metadata, injected into config.json at container
  # start (see frontend/docker-entrypoint.d/40-oidc-config.sh). All three
  # values are public in any browser's network tab during a real login --
  # no Secret. projectId is the Zitadel project ID used to request the
  # reserved "project audience" scope so the frontend's access token
  # satisfies the backend's secrets.oidcAudience check.
  oidc:
    authority: ""
    clientId: ""
    projectId: ""

docs:
  image:
    repository: ghcr.io/badconfigstudios/opentourney/docs
    tag: latest
    pullPolicy: Always
  replicas: 1
  port: 80

# Percona PostgreSQL Operator CRD
percona:
  enabled: true
  clusterName: opentourney-pg
  pgVersion: "16"
  storageSize: 5Gi
  backupStorageSize: 5Gi

secrets:
  databaseUrl: ""
  oidcIssuer: ""
  oidcAudience: ""
  oidcJwksUrl: ""
  oidcJwksStatic: ""

zitadel:
  enabled: false
  image:
    repository: ghcr.io/zitadel/zitadel
    tag: v4.17.1
    pullPolicy: IfNotPresent
  # Zitadel v4's core binary no longer serves login pages itself -- every
  # /oauth/v2/authorize redirects to this separate service. Defaults to
  # enabled whenever zitadel.enabled is true: there is no supported way to
  # complete a real login (browser or curl) without it.
  login:
    enabled: true
    image:
      repository: ghcr.io/zitadel/zitadel-login
      # Pinned to the same release as zitadel.image.tag above -- Zitadel
      # versions core and Login V2 together. Confirm this tag exists at
      # deploy time (Task 8); bump both tags together on future upgrades.
      tag: v4.17.1
      pullPolicy: IfNotPresent
    # Opt-in override for environments where Login V2 is exposed externally
    # (e.g. a Cloudflare tunnel route pointed at it) -- unset means core
    # redirects browsers to the in-cluster-only Service address, which only
    # works for curl/port-forward-based verification, not a real browser.
    # Same origin as the frontend and core Zitadel (see the top-level
    # `ingress` block below) -- no in-cluster/public identity split, so
    # Login V2's own server-generated redirects (which bake in
    # ZITADEL_EXTERNALDOMAIN directly, not just the inbound request Host)
    # resolve correctly for a real browser instead of pointing at an
    # unreachable internal hostname.
    # MUST include the `/ui/v2/login` suffix (e.g.
    # "https://host/ui/v2/login") -- an earlier version of this comment
    # claimed Zitadel's defaultBaseURL() appends the suffix itself and a bare
    # host was correct. That was never live-verified; the only configuration
    # ever confirmed working end-to-end (values.staging.yaml) uses the
    # suffixed form, and a bare host produces a 404 on login (issue #88 #1).
    publicBaseUri: ""
  # Empty by default so this reusable chart doesn't silently hardcode a namespace name
  # (this phase's DECISIONS.md 2026-08-09 calls for one Zitadel install per customer
  # namespace). Templates fall back to zitadel.<Release.Namespace>.svc.cluster.local when
  # unset — override explicitly per-environment (see values.staging.yaml) since Zitadel's
  # anti-DNS-rebinding Host validation 404s on any mismatch between this value and the
  # Host header requests actually carry.
  externalDomain: ""
  externalPort: 8080
  # False by default (matches this chart's original internal-only design).
  # Set true when externalDomain is a real publicly-reachable hostname served
  # over TLS at the edge (e.g. behind the Ingress below via Cloudflare) --
  # affects only how Zitadel constructs its own issuer/discovery/cookie URLs,
  # not the plain-HTTP transport it actually uses inside the cluster
  # (ZITADEL_TLS_ENABLED stays "false" unconditionally either way).
  externalSecure: false
  masterkey: ""
  firstInstance:
    orgName: "OpenTourney"
    adminUsername: "admin"
    adminPassword: ""

# Single-hostname gateway Ingress (Traefik): path-based routing so the
# frontend, core Zitadel, and Login V2 all share one public origin --
# zitadel.externalDomain should equal this same hostname when this is
# enabled (see zitadel.externalDomain above), which is what lets Zitadel's
# own domain-matching and Login V2's server-generated redirects work
# correctly for a real external browser with no header-rewriting tricks.
ingress:
  enabled: false
  className: traefik
  hostname: ""
